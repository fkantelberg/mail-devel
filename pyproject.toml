[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-devel"
dynamic = ["version"]
authors = [
  {name = "Florian Kantelberg", email = "florian.kantelberg@mailbox.org"},
]
requires-python = ">=3.11"
dependencies = [
  "aiohttp-jinja2",
  "aiosmtpd",
  "pymap~=0.36",
  "passlib",
  "typing-extensions",
]
description = "IMAP and SMTP in memory test server"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
keywords = ["imap", "smtp", "development"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]

[project.scripts]
mail_devel = "mail_devel.__main__:main"

[project.urls]
Repository = "https://github.com/fkantelberg/mail-devel"

[tool.coverage]
source = "*/mail_devel/*"
concurrency = "multiprocessing"
parallel = true

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.pylint.IMPORTS]
ignored-modules = "aiohttp,nox,pysasl,pymap,aiosmtpd,pytest,mail_devel"

[tool.pylint."MESSAGES CONTROL"]
disable="""
  bad-inline-option,
  bad-mcs-classmethod-argument,
  broad-except,
  deprecated-pragma,
  duplicate-code,
  file-ignored,
  invalid-name,
  locally-disabled,
  logging-fstring-interpolation,
  missing-class-docstring,
  missing-function-docstring,
  missing-module-docstring,
  protected-access,
  raw-checker-failed,
  redefined-outer-name,
  suppressed-message,
  too-few-public-methods,
  too-many-arguments,
  too-many-instance-attributes,
  too-many-return-statements,
  too-many-statements,
  use-symbolic-message-instead,
  useless-suppression,
"""

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
ignore = ["E203", "E266", "E501", "F403", "F401"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 5
addopts = ["--import-mode=importlib"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "mail_devel.utils.VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
